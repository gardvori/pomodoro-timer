<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Timer</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#c9d1d9;
    --accent:#ff6b6b;--accent2:#58a6ff;--green:#3fb950;--yellow:#d29922;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;display:flex;
    flex-direction:column;align-items:center;justify-content:center;padding:20px}
  h1{font-size:2rem;margin-bottom:4px;color:#fff}
  .subtitle{color:#8b949e;margin-bottom:32px;font-size:.95rem}
  .tabs{display:flex;gap:4px;margin-bottom:32px;background:var(--surface);
    border:1px solid var(--border);border-radius:10px;padding:4px}
  .tab{padding:8px 20px;border-radius:7px;border:none;cursor:pointer;font-size:.9rem;
    font-weight:600;background:transparent;color:#8b949e;transition:.2s}
  .tab.active{background:var(--accent);color:#fff}
  .tab.active[data-mode="short"]{background:var(--accent2)}
  .tab.active[data-mode="long"]{background:var(--green)}
  .timer-display{font-size:6rem;font-weight:700;font-variant-numeric:tabular-nums;
    letter-spacing:-2px;margin-bottom:8px;color:#fff}
  .timer-display.warning{color:var(--yellow)}
  .timer-display.danger{color:var(--accent)}
  .session-label{color:#8b949e;margin-bottom:32px;font-size:1.1rem}
  .controls{display:flex;gap:12px;margin-bottom:40px}
  .btn{padding:14px 36px;border-radius:10px;border:none;cursor:pointer;
    font-size:1rem;font-weight:600;transition:.15s}
  .btn-start{background:var(--accent);color:#fff}
  .btn-start:hover{background:#ff5252}
  .btn-pause{background:var(--yellow);color:#000}
  .btn-pause:hover{background:#e6a700}
  .btn-reset{background:var(--surface);color:var(--text);border:1px solid var(--border)}
  .btn-reset:hover{background:#21262d}
  .stats{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:16px 28px;text-align:center;min-width:120px}
  .stat-card .num{font-size:1.8rem;font-weight:700;color:#fff}
  .stat-card .lbl{font-size:.8rem;color:#8b949e;margin-top:4px}
  .progress-ring{margin-bottom:24px}
  .progress-ring circle{transition:stroke-dashoffset .3s}
  .settings{margin-top:32px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
  .settings label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:#8b949e}
  .settings input{width:80px;padding:6px 10px;border-radius:6px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-size:.9rem;text-align:center}
  .settings input:focus{outline:none;border-color:var(--accent2)}
  .history{margin-top:32px;width:100%;max-width:400px}
  .history h3{font-size:.9rem;color:#8b949e;margin-bottom:8px;text-align:center}
  .history-list{max-height:120px;overflow-y:auto}
  .history-item{display:flex;justify-content:space-between;padding:6px 12px;
    border-bottom:1px solid var(--border);font-size:.85rem}
  .history-item .mode{font-weight:600}
  .history-item .mode.pomodoro{color:var(--accent)}
  .history-item .mode.short{color:var(--accent2)}
  .history-item .mode.long{color:var(--green)}
  .history-item .time{color:#8b949e}
  .notification-permission{margin-top:16px;font-size:.8rem;color:#8b949e}
  .notification-permission button{background:none;border:1px solid var(--border);
    color:var(--accent2);padding:4px 12px;border-radius:6px;cursor:pointer;font-size:.8rem}
  footer{margin-top:40px;font-size:.75rem;color:#484f58}
</style>
</head>
<body>

<h1>🍅 Pomodoro Timer</h1>
<p class="subtitle">Stay focused. Take breaks. Be productive.</p>

<div class="tabs">
  <button class="tab active" data-mode="pomodoro" onclick="setMode('pomodoro')">Pomodoro</button>
  <button class="tab" data-mode="short" onclick="setMode('short')">Short Break</button>
  <button class="tab" data-mode="long" onclick="setMode('long')">Long Break</button>
</div>

<div class="progress-ring">
  <svg width="260" height="260" viewBox="0 0 260 260">
    <circle cx="130" cy="130" r="120" fill="none" stroke="#21262d" stroke-width="8"/>
    <circle id="progress" cx="130" cy="130" r="120" fill="none" stroke="var(--accent)"
      stroke-width="8" stroke-linecap="round"
      stroke-dasharray="753.98" stroke-dashoffset="0"
      transform="rotate(-90 130 130)"/>
  </svg>
</div>

<div class="timer-display" id="display">25:00</div>
<div class="session-label" id="sessionLabel">Focus Time</div>

<div class="controls">
  <button class="btn btn-start" id="btnStart" onclick="toggleTimer()">▶ Start</button>
  <button class="btn btn-reset" onclick="resetTimer()">↺ Reset</button>
</div>

<div class="stats">
  <div class="stat-card"><div class="num" id="sessionsDone">0</div><div class="lbl">Sessions</div></div>
  <div class="stat-card"><div class="num" id="totalFocus">0m</div><div class="lbl">Focus Time</div></div>
  <div class="stat-card"><div class="num" id="streak">0</div><div class="lbl">Streak 🔥</div></div>
</div>

<div class="settings">
  <label>Pomodoro (min) <input type="number" id="setPomodoro" value="25" min="1" max="90"></label>
  <label>Short Break <input type="number" id="setShort" value="5" min="1" max="30"></label>
  <label>Long Break <input type="number" id="setLong" value="15" min="1" max="60"></label>
</div>

<div class="notification-permission">
  <button onclick="requestNotification()">🔔 Enable Notifications</button>
</div>

<div class="history" id="historySection" style="display:none">
  <h3>📋 Session History</h3>
  <div class="history-list" id="historyList"></div>
</div>

<footer>Built with ❤️ by Armodeus · gardvori/pomodoro-timer</footer>

<script>
const MODES = { pomodoro: 25, short: 5, long: 15 };
let currentMode = 'pomodoro';
let totalSeconds = MODES[currentMode] * 60;
let initialSeconds = totalSeconds;
let interval = null;
let running = false;
let sessionsDone = 0;
let totalFocusMin = 0;
let streak = 0;
let history = [];
let endTime = 0;

const display = document.getElementById('display');
const progress = document.getElementById('progress');
const btnStart = document.getElementById('btnStart');
const sessionLabel = document.getElementById('sessionLabel');
const C = 2 * Math.PI * 120;

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
}

function updateDisplay() {
  display.textContent = formatTime(totalSeconds);
  const pct = 1 - totalSeconds / initialSeconds;
  progress.style.strokeDashoffset = C * (1 - pct);
  document.title = `${formatTime(totalSeconds)} — Pomodoro`;
  if (totalSeconds <= 30 && totalSeconds > 10) display.className = 'timer-display warning';
  else if (totalSeconds <= 10) display.className = 'timer-display danger';
  else display.className = 'timer-display';
}

function setMode(mode) {
  pauseTimer();
  currentMode = mode;
  const custom = parseInt(document.getElementById('set' + mode.charAt(0).toUpperCase() + mode.slice(1)).value) || MODES[mode];
  totalSeconds = custom * 60;
  initialSeconds = totalSeconds;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  const labels = { pomodoro: 'Focus Time', short: 'Short Break', long: 'Long Break' };
  sessionLabel.textContent = labels[mode];
  progress.style.stroke = mode === 'pomodoro' ? 'var(--accent)' : mode === 'short' ? 'var(--accent2)' : 'var(--green)';
  updateDisplay();
}

function toggleTimer() {
  if (running) pauseTimer();
  else startTimer();
}

function startTimer() {
  if (running) return;
  running = true;
  endTime = Date.now() + totalSeconds * 1000;
  btnStart.textContent = '⏸ Pause';
  btnStart.className = 'btn btn-pause';
  interval = setInterval(() => {
    const remaining = Math.round((endTime - Date.now()) / 1000);
    totalSeconds = Math.max(0, remaining);
    updateDisplay();
    if (totalSeconds <= 0) completeSession();
  }, 200);
}

function pauseTimer() {
  if (!running) return;
  running = false;
  clearInterval(interval);
  btnStart.textContent = '▶ Start';
  btnStart.className = 'btn btn-start';
}

function resetTimer() {
  pauseTimer();
  const custom = parseInt(document.getElementById('set' + currentMode.charAt(0).toUpperCase() + currentMode.slice(1)).value) || MODES[currentMode];
  totalSeconds = custom * 60;
  initialSeconds = totalSeconds;
  updateDisplay();
}

function completeSession() {
  pauseTimer();
  const now = new Date();
  const entry = { mode: currentMode, time: now.toLocaleTimeString(), date: now.toLocaleDateString() };
  history.unshift(entry);
  if (history.length > 20) history.pop();
  if (currentMode === 'pomodoro') {
    sessionsDone++;
    totalFocusMin += Math.round(initialSeconds / 60);
    streak++;
  }
  updateStats();
  renderHistory();
  notify();
  // Auto-switch
  if (currentMode === 'pomodoro') {
    setMode(sessionsDone % 4 === 0 ? 'long' : 'short');
  } else {
    setMode('pomodoro');
  }
}

function updateStats() {
  document.getElementById('sessionsDone').textContent = sessionsDone;
  document.getElementById('totalFocus').textContent = totalFocusMin >= 60
    ? `${Math.floor(totalFocusMin/60)}h ${totalFocusMin%60}m` : `${totalFocusMin}m`;
  document.getElementById('streak').textContent = streak;
}

function renderHistory() {
  const sec = document.getElementById('historySection');
  const list = document.getElementById('historyList');
  if (!history.length) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  list.innerHTML = history.map(h =>
    `<div class="history-item"><span class="mode ${h.mode}">${h.mode === 'pomodoro' ? '🍅 Pomodoro' : h.mode === 'short' ? '☕ Short Break' : '🌴 Long Break'}</span><span class="time">${h.date} ${h.time}</span></div>`
  ).join('');
}

function notify() {
  const msgs = { pomodoro: '🍅 Time for a break!', short: '☕ Back to focus!', long: '🌴 Back to work!' };
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('Pomodoro Timer', { body: msgs[currentMode] || 'Session complete!', icon: '🍅' });
  }
}

function requestNotification() {
  if ('Notification' in window) Notification.requestPermission();
}

// Settings listeners
['Pomodoro','Short','Long'].forEach(m => {
  document.getElementById('set' + m).addEventListener('change', () => {
    if (!running) setMode(m.toLowerCase() === 'pomodoro' ? 'pomodoro' : m.toLowerCase());
  });
});

// Keyboard shortcut
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggleTimer(); }
  if (e.code === 'KeyR') resetTimer();
});

progress.style.strokeDasharray = C;
progress.style.strokeDashoffset = 0;
updateDisplay();
</script>
</body>
</html>
