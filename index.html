<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Timer</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --primary: #e94560;
    --primary-hover: #ff6b81;
    --text: #eee;
    --text-dim: #aaa;
    --accent: #0f3460;
    --success: #4ecca3;
    --warning: #f9a825;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  h1 {
    font-size: 1.8rem;
    margin-bottom: 8px;
    font-weight: 700;
  }
  .subtitle { color: var(--text-dim); margin-bottom: 30px; font-size: 0.9rem; }

  /* Timer display */
  .timer-ring {
    position: relative;
    width: 280px;
    height: 280px;
    margin: 0 auto 30px;
  }
  .timer-ring svg {
    transform: rotate(-90deg);
    width: 100%; height: 100%;
  }
  .timer-ring .bg { fill: none; stroke: var(--accent); stroke-width: 8; }
  .timer-ring .progress {
    fill: none;
    stroke: var(--primary);
    stroke-width: 8;
    stroke-linecap: round;
    stroke-dasharray: 816;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 0.5s ease;
  }
  .timer-ring .time-display {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -60%);
    text-align: center;
  }
  .timer-ring .time {
    font-size: 3.5rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
  }
  .timer-ring .label {
    font-size: 0.85rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-top: 4px;
  }

  /* Mode tabs */
  .modes {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    background: var(--surface);
    border-radius: 12px;
    padding: 4px;
  }
  .modes button {
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text-dim);
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .modes button.active {
    background: var(--primary);
    color: #fff;
    font-weight: 600;
  }
  .modes button:hover:not(.active) { color: var(--text); }

  /* Controls */
  .controls { display: flex; gap: 12px; margin-bottom: 30px; }
  .controls button {
    padding: 12px 32px;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  #btnStart { background: var(--primary); color: #fff; }
  #btnStart:hover { background: var(--primary-hover); transform: scale(1.03); }
  #btnPause { background: var(--warning); color: #1a1a2e; display: none; }
  #btnPause:hover { filter: brightness(1.1); }
  #btnReset {
    background: var(--accent);
    color: var(--text-dim);
  }
  #btnReset:hover { color: var(--text); }

  /* Settings */
  .settings {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .settings .field {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .settings label {
    font-size: 0.75rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .settings input[type="number"] {
    width: 60px;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 6px;
    color: var(--text);
    text-align: center;
    font-size: 0.95rem;
  }
  .settings input:focus { outline: 2px solid var(--primary); }

  /* Stats */
  .stats {
    display: flex;
    gap: 24px;
    background: var(--surface);
    border-radius: 12px;
    padding: 16px 28px;
  }
  .stats .stat {
    text-align: center;
  }
  .stats .stat-value {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--success);
  }
  .stats .stat-label {
    font-size: 0.7rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  /* Session dots */
  .session-dots {
    display: flex;
    gap: 8px;
    margin-top: 20px;
  }
  .session-dots .dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    transition: background 0.3s;
  }
  .session-dots .dot.done { background: var(--success); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--success);
    color: #1a1a2e;
    padding: 12px 24px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.95rem;
    opacity: 0;
    transition: all 0.4s ease;
    z-index: 100;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  footer {
    margin-top: 30px;
    color: var(--text-dim);
    font-size: 0.75rem;
  }
  footer a { color: var(--primary); text-decoration: none; }
</style>
</head>
<body>

<h1>🍅 Pomodoro Timer</h1>
<p class="subtitle">Stay focused. Take breaks. Be productive.</p>

<div class="modes">
  <button class="active" data-mode="pomodoro">Pomodoro</button>
  <button data-mode="short">Short Break</button>
  <button data-mode="long">Long Break</button>
</div>

<div class="timer-ring">
  <svg viewBox="0 0 290 290">
    <circle class="bg" cx="145" cy="145" r="130"></circle>
    <circle class="progress" id="progressCircle" cx="145" cy="145" r="130"></circle>
  </svg>
  <div class="time-display">
    <div class="time" id="timeDisplay">25:00</div>
    <div class="label" id="labelDisplay">Focus</div>
  </div>
</div>

<div class="controls">
  <button id="btnStart">▶ Start</button>
  <button id="btnPause">⏸ Pause</button>
  <button id="btnReset">↺ Reset</button>
</div>

<div class="settings">
  <div class="field">
    <label>Pomodoro (min)</label>
    <input type="number" id="setPomodoro" value="25" min="1" max="99">
  </div>
  <div class="field">
    <label>Short Break</label>
    <input type="number" id="setShort" value="5" min="1" max="30">
  </div>
  <div class="field">
    <label>Long Break</label>
    <input type="number" id="setLong" value="15" min="1" max="60">
  </div>
  <div class="field">
    <label>Sessions</label>
    <input type="number" id="setSessions" value="4" min="1" max="10">
  </div>
</div>

<div class="stats">
  <div class="stat">
    <div class="stat-value" id="statCompleted">0</div>
    <div class="stat-label">Completed</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="statStreak">0</div>
    <div class="stat-label">Best Streak</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="statTotal">0m</div>
    <div class="stat-label">Total Focus</div>
  </div>
</div>

<div class="session-dots" id="sessionDots"></div>

<div class="toast" id="toast"></div>
<footer><a href="https://github.com/gardvori/pomodoro-timer" target="_blank">github.com/gardvori/pomodoro-timer</a></footer>

<script>
const CONFIG = {
  pomodoro: 25 * 60,
  short: 5 * 60,
  long: 15 * 60,
  sessionsBeforeLong: 4
};

const LABELS = { pomodoro: 'Focus', short: 'Short Break', long: 'Long Break' };

let mode = 'pomodoro';
let timeLeft = CONFIG.pomodoro;
let totalTime = CONFIG.pomodoro;
let interval = null;
let running = false;
let sessionCount = 0;
let bestStreak = Number(localStorage.getItem('pomo_best') || 0);
let totalFocusMin = Number(localStorage.getItem('pomo_total') || 0);
let audioCtx = null;

const $ = s => document.querySelector(s);
const timeDisplay = $('#timeDisplay');
const labelDisplay = $('#labelDisplay');
const progressCircle = $('#progressCircle');
const btnStart = $('#btnStart');
const btnPause = $('#btnPause');
const btnReset = $('#btnReset');
const toastEl = $('#toast');
const sessionDots = $('#sessionDots');

const CIRC = 2 * Math.PI * 130; // ~816.8

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function updateDisplay() {
  timeDisplay.textContent = formatTime(timeLeft);
  const pct = 1 - timeLeft / totalTime;
  progressCircle.style.strokeDashoffset = CIRC * pct;
}

function renderDots() {
  const n = parseInt($('#setSessions').value) || 4;
  sessionDots.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < sessionCount ? ' done' : '');
    sessionDots.appendChild(d);
  }
}

function updateStats() {
  $('#statCompleted').textContent = sessionCount;
  $('#statStreak').textContent = bestStreak;
  $('#statTotal').textContent = totalFocusMin + 'm';
  localStorage.setItem('pomo_best', bestStreak);
  localStorage.setItem('pomo_total', totalFocusMin);
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 3000);
}

function playBeep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.value = 0.3;
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
    osc.stop(audioCtx.currentTime + 0.6);
  } catch(e) {}
}

function completeSession() {
  playBeep();
  if (mode === 'pomodoro') {
    sessionCount++;
    totalFocusMin += parseInt($('#setPomodoro').value) || 25;
    if (sessionCount > bestStreak) bestStreak = sessionCount;
    const n = parseInt($('#setSessions').value) || 4;
    if (sessionCount % n === 0) {
      switchMode('long');
      showToast('🎉 Sessions complete! Long break.');
    } else {
      switchMode('short');
      showToast('🍅 Pomodoro done! Short break.');
    }
  } else {
    switchMode('pomodoro');
    showToast('☕ Break over! Back to focus.');
  }
  updateStats();
  renderDots();
}

function switchMode(m) {
  mode = m;
  const map = { pomodoro: 'setPomodoro', short: 'setShort', long: 'setLong' };
  const mins = parseInt($(`#${map[m]}`).value) || CONFIG[m] / 60;
  totalTime = mins * 60;
  timeLeft = totalTime;
  labelDisplay.textContent = LABELS[m];
  progressCircle.style.stroke = m === 'pomodoro' ? '#e94560' : '#4ecca3';
  document.querySelectorAll('.modes button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === m);
  });
  updateDisplay();
  if (running) { clearInterval(interval); interval = null; startTimer(); }
}

let notifPermission = false;

function requestNotification() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission().then(p => { notifPermission = p === 'granted'; });
  } else if ('Notification' in window) {
    notifPermission = Notification.permission === 'granted';
  }
}

function notify(title) {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification(title);
  }
}

function startTimer() {
  if (running) return;
  running = true;
  requestNotification();
  btnStart.style.display = 'none';
  btnPause.style.display = 'inline-block';
  interval = setInterval(() => {
    if (timeLeft > 0) {
      timeLeft--;
      updateDisplay();
      // Update document title
      document.title = `${formatTime(timeLeft)} — ${LABELS[mode]}`;
    } else {
      clearInterval(interval);
      interval = null;
      running = false;
      btnStart.style.display = 'inline-block';
      btnPause.style.display = 'none';
      document.title = '🍅 Pomodoro Timer';
      completeSession();
    }
  }, 1000);
}

function pauseTimer() {
  if (!running) return;
  clearInterval(interval);
  interval = null;
  running = false;
  btnStart.style.display = 'inline-block';
  btnPause.style.display = 'none';
}

function resetTimer() {
  pauseTimer();
  switchMode(mode);
}

// Event listeners
btnStart.addEventListener('click', startTimer);
btnPause.addEventListener('click', pauseTimer);
btnReset.addEventListener('click', resetTimer);

document.querySelectorAll('.modes button').forEach(btn => {
  btn.addEventListener('click', () => {
    if (running) { pauseTimer(); }
    switchMode(btn.dataset.mode);
  });
});

$('#setSessions').addEventListener('change', renderDots);

// Init
renderDots();
updateStats();
progressCircle.style.strokeDasharray = CIRC;
progressCircle.style.strokeDashoffset = 0;
updateDisplay();

// Keyboard: Space to start/pause
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
    e.preventDefault();
    running ? pauseTimer() : startTimer();
  }
});
</script>
</body>
</html>
